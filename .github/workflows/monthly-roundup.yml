name: Monthly stats round-up

# Fires on the 1st of every month at 07:00 BST (06:00 UTC) to generate
# the previous month's stats round-up PDF. By that time every match of
# the previous calendar month has been played and voting has closed on
# every match — so all numbers are final. See scripts/monthly-report.mjs
# for the render logic; this workflow is just the cron + git plumbing.
#
# Manual runs: Actions tab → Monthly stats round-up → Run workflow.
# Pass a specific YYYY-MM in the input to backfill or re-render a
# previous month.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to render (YYYY-MM). Leave empty for previous month.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Node 22+ required — @supabase/supabase-js 2.45+ pulls in
          # realtime-js which needs the native WebSocket that only
          # landed in Node 22. Node 20 crashes at createClient().
          node-version: '22'

      - name: Install WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y weasyprint

      - name: Install Node deps
        run: npm install --no-save @supabase/supabase-js@^2.45.0

      - name: Compute target month
        id: month
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            echo "value=${{ inputs.month }}" >> "$GITHUB_OUTPUT"
          else
            # Previous month, in UTC (fine — the cron fires at 06:00 UTC on the 1st,
            # so "yesterday" is always the previous calendar month).
            echo "value=$(date -u -d 'yesterday' +'%Y-%m')" >> "$GITHUB_OUTPUT"
          fi

      - name: Render report
        env:
          SUPABASE_URL: https://qvvlxjftrteyrsscqidc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/monthly-report.mjs ${{ steps.month.outputs.value }}

      - name: Commit + push
        run: |
          set -e
          MONTH=${{ steps.month.outputs.value }}
          if [ -z "$(git status --porcelain docs/primers/monthly/)" ]; then
            echo "::notice::No changes to commit — either no matches that month or already up to date."
            exit 0
          fi
          git config user.name  'wf-monthly-bot'
          git config user.email 'wf-monthly-bot@users.noreply.github.com'
          git add docs/primers/monthly/
          git commit -m "Monthly report: ${MONTH}" \
            -m "Auto-generated by .github/workflows/monthly-roundup.yml. Data pulled from Supabase; template + logic in scripts/monthly-report.mjs."
          git push origin HEAD
